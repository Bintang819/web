<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Red Bull Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #080c14; color: #ffffff; }

        /* Navigation Bar */
        nav {
            background-color: #0b0f19;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eb1723;
        }

        .brand {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .brand span { color: #eb1723; }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffcc00;
        }

        /* Hero Section */
        .hero {
            padding: 100px 40px;
            text-align: center;
            background: linear-gradient(180deg, #0b0f19 0%, #080c14 100%);
        }

        .hero h1 { font-size: 42px; margin-bottom: 10px; }
        .hero p { color: #8899a6; font-size: 18px; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav>
        <div class="brand">Oracle <span>Red Bull</span> Racing</div>
        <div class="nav-links">
            <a href="/" class="active">Home</a>
            <a href="/team">Team</a>
            <a href="/drivers">Drivers</a>
            <a href="/shop" target="_blank">Shop ↗</a>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="hero">
        <h1>GIVES YOU WINGS</h1>
        <p>Selamat datang di situs resmi Oracle Red Bull Racing.</p>
    </section>

</body>
</html>
