<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Navigasi Elegan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
        }

        /* Navigasi Bar */
        nav {
            background-color: #0b0b0b;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-menu a {
            color: #bbb;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: #ffffff;
        }

        .nav-menu a.active {
            font-weight: 600;
        }

        /* Konten Utama */
        .hero {
            padding: 80px 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #888;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Navigasi -->
    <nav>
        <div class="nav-brand">EigerAdventure Offic...</div>
        <div class="nav-menu">
            <a href="#" class="active" style="color: #ffffff;">Home</a>
            <a href="#">Shop</a>
            <a href="#">Tentang ▾</a>
            <a href="#">Member</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Konten -->
    <section class="hero">
        <h1>Selamat Datang di Website Anda</h1>
        <p>Struktur HTML sudah dilengkapi dengan DOCTYPE standar dan navigasi elegan.</p>
    </section>

</body>
</html>
